name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger les exercices
        run: node scripts/sync.mjs
        continue-on-error: true
      - name: Traduire en français
        run: node scripts/translate.mjs
        continue-on-error: true
      - name: Garder les traductions
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/fr-cache.json data/a-traduire.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/fr-cache.json data/a-traduire.json
            git commit -m "Mise à jour des traductions"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
